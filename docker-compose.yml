version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: diagram_solution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diagram_solution}
      POSTGRES_USER: ${POSTGRES_USER:-diagram_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diagram_local_dev_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diagram_user} -d ${POSTGRES_DB:-diagram_solution}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: diagram_solution_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
